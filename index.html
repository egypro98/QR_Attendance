<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance and Absence</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background: #f4f4f9;
            padding: 20px;
        }

        #reader {
            width: 300px;
            margin: auto;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <h2>تسجيل الحضور بـ QR Code</h2>
    <div id="reader"></div>
    <div id="result"></div>

    <script>
                // ضع الرابط الجديد هنا
                const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzb2SFwbZIg-olkHBdti6U0pmzJzMpGJrYT67N3DOMKapr7lGag2KC1NTQaa1Ogjs0G/exec";

                function onScanSuccess(decodedText, decodedResult) {
                    html5QrcodeScanner.clear();
                    document.getElementById('result').innerText = "جاري تسجيل الحضور للكود: " + decodedText;

                    // إرسال البيانات عبر GET (تتجاوز مشاكل الاستضافة تماماً)
                    const finalUrl = `${WEB_APP_URL}?userId=${encodeURIComponent(decodedText)}&userName=موظف`;

                    fetch(finalUrl)
                        .then(response => response.json())
                        .then(data => {
                            document.getElementById('result').innerText = "تم تسجيل الحضور بنجاح!";
                            setTimeout(() => { location.reload(); }, 3000);
                        })
                        .catch(error => {
                            console.error('Error!', error);
                            document.getElementById('result').innerText = "تم الإرسال (تحقق من الجدول).";
                            setTimeout(() => { location.reload(); }, 3000);
                        });
                }

                var html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", { fps: 10, qrbox: 250 }, false);
                html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
